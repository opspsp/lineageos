name: Diff IR content for alioth

on:
  workflow_dispatch:

jobs:
  diff-ir:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout broken kernel source
        uses: actions/checkout@v4
        with:
          repository: AstideLabs/android_kernel_xiaomi_sm8250
          ref: android16-aptusitu
          submodules: recursive
          path: broken-kernel

      - name: Checkout reference kernel source
        uses: actions/checkout@v4
        with:
          repository: IzumiYouka/android_kernel_xiaomi_sm8250
          ref: freesia
          submodules: recursive
          path: reference-kernel

      - name: Diff alioth DTS files and defconfig
        run: |
          DTS_PATH="arch/arm64/boot/dts/vendor/qcom"
          {
            echo "=========================================="
            echo " DIFF: alioth-sm8250.dtsi"
            echo "=========================================="
            diff broken-kernel/$DTS_PATH/alioth-sm8250.dtsi \
                 reference-kernel/$DTS_PATH/alioth-sm8250.dtsi || true

            echo ""
            echo "=========================================="
            echo " DIFF: alioth-sm8250-overlay.dts"
            echo "=========================================="
            diff broken-kernel/$DTS_PATH/alioth-sm8250-overlay.dts \
                 reference-kernel/$DTS_PATH/alioth-sm8250-overlay.dts || true

            echo ""
            echo "=========================================="
            echo " DIFF: alioth-pinctrl.dtsi"
            echo "=========================================="
            diff broken-kernel/$DTS_PATH/alioth-pinctrl.dtsi \
                 reference-kernel/$DTS_PATH/alioth-pinctrl.dtsi || true

            echo ""
            echo "=========================================="
            echo " IR-related grep in alioth-sm8250.dtsi (BROKEN)"
            echo "=========================================="
            grep -in "ir\|infrared\|pwm.*ir\|ir.*pwm\|blaster" \
                 broken-kernel/$DTS_PATH/alioth-sm8250.dtsi || echo "NOT FOUND"

            echo ""
            echo "=========================================="
            echo " IR-related grep in alioth-sm8250.dtsi (REFERENCE)"
            echo "=========================================="
            grep -in "ir\|infrared\|pwm.*ir\|ir.*pwm\|blaster" \
                 reference-kernel/$DTS_PATH/alioth-sm8250.dtsi || echo "NOT FOUND"

            echo ""
            echo "=========================================="
            echo " DIFF: alioth defconfig (IR flags)"
            echo "=========================================="
            BROKEN_DEF=$(find broken-kernel/arch/arm64/configs -name "*alioth*" | head -1)
            REF_DEF=$(find reference-kernel/arch/arm64/configs -name "*alioth*" | head -1)
            echo "Broken defconfig: $BROKEN_DEF"
            echo "Reference defconfig: $REF_DEF"
            grep -iE "IR|INFRARED|LIRC|RC_CORE|PWM_IR" "$BROKEN_DEF" 2>/dev/null || echo "No IR flags in broken defconfig"
            echo "---"
            grep -iE "IR|INFRARED|LIRC|RC_CORE|PWM_IR" "$REF_DEF" 2>/dev/null || echo "No IR flags in reference defconfig"

          } | tee ir-diff-results.txt

      - name: Upload diff results
        uses: actions/upload-artifact@v4
        with:
          name: ir-diff-results
          path: ir-diff-results.txt
          retention-days: 7

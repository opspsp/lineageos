name: Fix IR driver for alioth

on:
  workflow_dispatch:

jobs:
  fix-ir:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout broken kernel source
        uses: actions/checkout@v4
        with:
          repository: AstideLabs/android_kernel_xiaomi_sm8250
          ref: android16-aptusitu
          submodules: recursive
          path: broken-kernel

      - name: Checkout reference kernel source (working IR)
        uses: actions/checkout@v4
        with:
          repository: IzumiYouka/android_kernel_xiaomi_sm8250
          ref: freesia
          submodules: recursive
          path: reference-kernel

      - name: Scan IR files in both sources
        run: |
          {
            echo "=========================================="
            echo " IR files in BROKEN kernel"
            echo "=========================================="
            grep -rlE "consumer_ir|ir_blaster|qcom,ir|ir-recv|ir-tx" \
              --include="*.c" --include="*.h" --include="*.dts" \
              --include="*.dtsi" --include="Kconfig" --include="Makefile" \
              broken-kernel/ 2>/dev/null

            echo ""
            echo "=========================================="
            echo " IR files in REFERENCE kernel"
            echo "=========================================="
            grep -rlE "consumer_ir|ir_blaster|qcom,ir|ir-recv|ir-tx" \
              --include="*.c" --include="*.h" --include="*.dts" \
              --include="*.dtsi" --include="Kconfig" --include="Makefile" \
              reference-kernel/ 2>/dev/null

            echo ""
            echo "=========================================="
            echo " alioth DTS files in BROKEN kernel"
            echo "=========================================="
            find broken-kernel/ -type f \( -name "*alioth*" -o -name "*aliothin*" \) \
              \( -name "*.dts" -o -name "*.dtsi" \) 2>/dev/null

            echo ""
            echo "=========================================="
            echo " alioth DTS files in REFERENCE kernel"
            echo "=========================================="
            find reference-kernel/ -type f \( -name "*alioth*" -o -name "*aliothin*" \) \
              \( -name "*.dts" -o -name "*.dtsi" \) 2>/dev/null

            echo ""
            echo "=========================================="
            echo " IR driver folders in BROKEN kernel"
            echo "=========================================="
            find broken-kernel/ -type d -iname "*ir*" 2>/dev/null

            echo ""
            echo "=========================================="
            echo " IR driver folders in REFERENCE kernel"
            echo "=========================================="
            find reference-kernel/ -type d -iname "*ir*" 2>/dev/null

          } | tee ir-scan-results.txt

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: ir-scan-results
          path: ir-scan-results.txt
          retention-days: 7

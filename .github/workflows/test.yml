name: Diff ir-spi driver and DTS node

on:
  workflow_dispatch:

jobs:
  diff-driver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout broken kernel source
        uses: actions/checkout@v4
        with:
          repository: AstideLabs/android_kernel_xiaomi_sm8250
          ref: android16-aptusitu
          submodules: recursive
          path: broken-kernel

      - name: Checkout reference kernel source
        uses: actions/checkout@v4
        with:
          repository: IzumiYouka/android_kernel_xiaomi_sm8250
          ref: freesia
          submodules: recursive
          path: reference-kernel

      - name: Diff ir-spi driver and DTS node
        run: |
          {
            echo "=========================================="
            echo " DIFF: drivers/media/rc/ir-spi.c"
            echo "=========================================="
            diff broken-kernel/drivers/media/rc/ir-spi.c \
                 reference-kernel/drivers/media/rc/ir-spi.c || true

            echo ""
            echo "=========================================="
            echo " ir-spi@0 full node in BROKEN xiaomi-sm8250-common.dtsi"
            echo "=========================================="
            grep -n -A 30 "ir-spi@0" \
              broken-kernel/arch/arm64/boot/dts/vendor/qcom/xiaomi-sm8250-common.dtsi || true

            echo ""
            echo "=========================================="
            echo " ir-spi@0 full node in REFERENCE xiaomi-sm8250-common.dtsi"
            echo "=========================================="
            grep -n -A 30 "ir-spi@0" \
              reference-kernel/arch/arm64/boot/dts/vendor/qcom/xiaomi-sm8250-common.dtsi || true

          } | tee ir-driver-diff.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ir-driver-diff
          path: ir-driver-diff.txt
          retention-days: 7

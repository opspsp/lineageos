name: Copy my changes to other branches

on:
  workflow_dispatch:
    inputs:
      target_branches:
        description: "Target branches: * for all, or comma-separated (e.g. branch1,branch2)"
        required: true
        type: string
      my_username:
        description: "Your GitHub username to detect your commits"
        required: true
        type: string

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "TODAY=$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_ENV
          echo "SOURCE_BRANCH=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Detect my changed files
        run: |
          USERNAME="${{ github.event.inputs.my_username }}"
          git log --author="$USERNAME" --pretty=format:"%H" | \
            xargs -I{} git diff-tree --no-commit-id -r --name-only {} | \
            sort -u > /tmp/files_to_copy.txt
          echo "[*] Files changed by $USERNAME:"
          cat /tmp/files_to_copy.txt

      - name: Resolve target branches
        id: resolve
        run: |
          INPUT="${{ github.event.inputs.target_branches }}"
          SOURCE_BRANCH="${{ github.ref_name }}"
          if [[ "$INPUT" == "*" ]]; then
            BRANCHES=$(git branch -r | grep "origin/" | grep -v "HEAD" | \
              sed 's|origin/||' | tr -d ' ' | grep -v "^${SOURCE_BRANCH}$")
          else
            BRANCHES=$(echo "$INPUT" | tr ',' '\n' | tr -d ' ' | \
              grep -v "^${SOURCE_BRANCH}$")
          fi
          echo "branches<<EOF" >> $GITHUB_OUTPUT
          echo "$BRANCHES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Save source files
        run: |
          mkdir -p /tmp/source_files
          while read f; do
            [[ -f "$f" ]] || continue
            mkdir -p "/tmp/source_files/$(dirname $f)"
            cp "$f" "/tmp/source_files/$f"
          done < /tmp/files_to_copy.txt

      - name: Copy to each target branch
        run: |
          SOURCE_BRANCH="${{ github.ref_name }}"
          while IFS= read -r branch; do
            [[ -z "$branch" ]] && continue
            echo "======================================="
            echo "Copying to branch: $branch"
            echo "======================================="
            git checkout "$branch" || { git checkout "$SOURCE_BRANCH"; continue; }
            while read relpath; do
              [[ -z "$relpath" ]] && continue
              srcfile="/tmp/source_files/$relpath"
              [[ -f "$srcfile" ]] || continue
              if [[ "$relpath" == .github/workflows/* ]]; then
                BASENAME=$(basename "$relpath")
                DIRNAME=$(dirname "$relpath")
                NAME="${BASENAME%.*}"; EXT="${BASENAME##*.}"
                if [[ -f "$relpath" ]] && ! cmp -s "$srcfile" "$relpath"; then
                  mv "$relpath" "${DIRNAME}/${NAME}_${TODAY}.${EXT}"
                  echo "[~] Renamed: $BASENAME"
                fi
                mkdir -p "$DIRNAME"
                cp "$srcfile" "$relpath"
              else
                mkdir -p "$(dirname $relpath)"
                cp "$srcfile" "$relpath"
              fi
              echo "[+] Copied: $relpath"
            done < /tmp/files_to_copy.txt
            git add -A
            if git diff --cached --quiet; then
              echo "[=] No changes on $branch"
            else
              git commit -m "chore: sync my changes from $SOURCE_BRANCH [$TODAY]"
              git push origin "$branch"
              echo "[+] $branch updated"
            fi
            git checkout "$SOURCE_BRANCH"
          done <<< "${{ steps.resolve.outputs.branches }}"

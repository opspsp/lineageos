name: Find raw log source in aw8697

on:
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find raw log source
        run: |
          echo "=== grep 'raw: 0x' in aw8697 files ==="
          grep -rn "raw: 0x\|\"raw:\"\|raw.*0x" \
            $(grep -rl "awinic,aw8697" --include="*.c" .) 2>/dev/null || echo "NOT FOUND"

          echo ""
          echo "=== all printk/pr_info/dev_info remaining ==="
          DRV_DIR=$(dirname "$(grep -rl "awinic,aw8697_haptic" --include="*.c" .)")
          grep -n "printk\|pr_info\|dev_info\|pr_err\|dev_err" "$DRV_DIR"/*.c 2>/dev/null | head -30

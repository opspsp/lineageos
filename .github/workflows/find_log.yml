name: Find raw 0x two-digit source

on:
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Search
        run: |
          {
            echo "=========================================="
            echo " grep 'raw: 0x' with 2-digit hex"
            echo "=========================================="
            grep -rn '"raw: 0x%0\?2x\|raw: 0x%02\|raw: 0x%.2\|raw: 0x%x' \
              --include="*.c" . 2>/dev/null | head -30 || echo "NOT FOUND"

            echo ""
            echo "=========================================="
            echo " grep exact string raw: 0x in all .c files"
            echo "=========================================="
            grep -rn '"raw: 0x' \
              --include="*.c" . 2>/dev/null | head -30 || echo "NOT FOUND"

          } | tee raw-source.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: raw-source
          path: raw-source.txt
          retention-days: 7
